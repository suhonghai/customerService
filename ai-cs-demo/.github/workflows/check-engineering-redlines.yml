name: Check Engineering Redlines (ai-cs-demo)

on:
  pull_request:
    paths:
      - 'W9-10-customer-service/ai-cs-demo/src/**'
      - 'W9-10-customer-service/ai-cs-demo/scripts/mcp-servers/**'
      - 'W9-10-customer-service/ai-cs-demo/next.config.ts'
      - 'W9-10-customer-service/ai-cs-demo/tsconfig.json'
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    paths:
      - 'W9-10-customer-service/ai-cs-demo/src/**'
      - 'W9-10-customer-service/ai-cs-demo/scripts/mcp-servers/**'
  workflow_dispatch:

# W11-P1-2 / S7: grep-based engineering redlines for ai-cs-demo. Catches obvious
# anti-patterns that linters cannot: hardcoded DASHSCOPE API keys, stray console
# statements in production code, hardcoded absolute paths in MCP server spawn.
#
# Why grep (not ESLint/Custom rule):
# - Cheap, zero dependency on local toolchain version
# - Universal across stack changes
# - Easy to whitelist (path/file patterns)
#
# False positive handling: do NOT lower the threshold, add to whitelist below.

concurrency:
  group: check-engineering-redlines-cs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  redlines:
    name: Engineering Redlines (ai-cs-demo)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (pinned to W11 pr-tests.yml SHA)

      # ✅ Check 1 - No hardcoded DASHSCOPE_API_KEY / API keys
      # Forbid plaintext DASHSCOPE_API_KEY / apiKey / api_key / token assignments
      # with real key prefixes (sk-, pk-, gsk_).
      # Whitelist: tests, fixtures, scripts (env helpers may reference env var names).
      - name: Check 1 - No hardcoded DASHSCOPE_API_KEY
        run: |
          MATCHES=$(grep -RnE "(DASHSCOPE_API_KEY|apiKey|api_key|token)\s*[:=]\s*['\"](sk-|pk-|gsk_)[^'\"]+['\"]" \
            --include="*.ts" --include="*.tsx" \
            --exclude-dir="node_modules" --exclude-dir=".next" --exclude-dir="dist" \
            --exclude-dir="__tests__" --exclude-dir="test" \
            --exclude="*.test.ts" --exclude="*.spec.ts" --exclude="*.fixture.ts" \
            --exclude="*.example" \
            W9-10-customer-service/ai-cs-demo/src/ \
            W9-10-customer-service/ai-cs-demo/scripts/ || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Hardcoded DASHSCOPE_API_KEY / API key detected (must use env var or ai-config.ts hot reload):"
            echo "$MATCHES"
            exit 1
          fi
          echo "✅ Check 1 passed: no hardcoded API keys"

      # ✅ Check 2 - No console.log/debug in production code
      # Forbid console.log / debug in production code.
      # Whitelist: a small set of bootstrap/diagnostic files where console.* is
      #   acceptable because the structured logger isn't wired yet (model init,
      #   subprocess spawn, vector store init, parser fallback, page-event
      #   dev hooks). See plan 2026-07-16-ai-cs-demo-borrow.md §S7 risk #1.
      #   - ai-config.ts: configuration reload (gated by isTest, no PII)
      #   - ai.ts: AI model wire-up diagnostic (pre-logger init)
      #   - mcp-client.ts: MCP subprocess spawn log (pre-logger init)
      #   - rag.ts: Chroma / in-memory store init diagnostic
      #   - parser.ts: stream parser fallback diagnostic
      #   - route.ts: chat handoff + abort observability (Day 7-9 dev hook)
      #   - ErrorBubble.tsx: escalate / upload dev-facing log (Day 7 阶段)
      #   - use-realtime.ts: socket connect/disconnect diagnostic
      #   - page.tsx: client-side dev hooks (escalate/go-upload)
      # NOTE: grep --exclude matches against the BASENAME of any file at any depth.
      # Use the structured logger (Pino / Next.js logger) for normal code paths.
      # Future cleanup: migrate these to a real logger and shrink the whitelist.
      - name: Check 2 - No console.log/debug in production
        run: |
          MATCHES=$(grep -RnE "console\.(log|debug)" \
            --include="*.ts" --include="*.tsx" \
            --exclude-dir="node_modules" --exclude-dir=".next" --exclude-dir="dist" \
            --exclude-dir="__tests__" --exclude-dir="test" \
            --exclude="*.test.ts" --exclude="*.spec.ts" \
            --exclude="ai-config.ts" \
            --exclude="ai.ts" \
            --exclude="mcp-client.ts" \
            --exclude="rag.ts" \
            --exclude="parser.ts" \
            --exclude="route.ts" \
            --exclude="ErrorBubble.tsx" \
            --exclude="use-realtime.ts" \
            --exclude="page.tsx" \
            W9-10-customer-service/ai-cs-demo/src/ || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::console.log/debug in production code:"
            echo "$MATCHES"
            echo ""
            echo "💡 Use Next.js logger or structured logging instead of console.*"
            exit 1
          fi
          echo "✅ Check 2 passed: no console.log/debug in production"

      # ✅ Check 3 - No hardcoded MCP server absolute paths
      # Forbid hardcoded absolute paths in MCP server spawn config (subprocess
      # injection risk). Allow list of prefixes: /home/, /Users/, C:\\, /root/, /opt/.
      # Scoped to src/lib/agent/ + scripts/mcp-servers/ to avoid false positives
      # in env helpers, type definitions, and other unrelated code.
      # Use relative paths, import.meta.url, process.cwd(), or MCP_ALLOWED_ROOTS env.
      - name: Check 3 - No hardcoded MCP server paths
        run: |
          MATCHES=$(grep -RnE "(path|execPath|tsxPath)\s*[:=]\s*['\"](/home/|/Users/|C:\\\\|/root/|/opt/)[^'\"]+['\"]" \
            --include="*.ts" --include="*.tsx" \
            --exclude-dir="node_modules" --exclude-dir=".next" --exclude-dir="dist" \
            --exclude-dir="__tests__" --exclude-dir="test" \
            --exclude="*.test.ts" --exclude="*.spec.ts" \
            W9-10-customer-service/ai-cs-demo/src/lib/agent/ \
            W9-10-customer-service/ai-cs-demo/scripts/mcp-servers/ || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Hardcoded absolute path detected in MCP server config:"
            echo "$MATCHES"
            echo ""
            echo "💡 Use relative path or env var (e.g., import.meta.url or process.cwd())"
            exit 1
          fi
          echo "✅ Check 3 passed: no hardcoded MCP server paths"

      - name: Summary
        if: success()
        run: echo "🎉 All engineering redlines passed"
