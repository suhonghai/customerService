# ======================================================================================
# Workflow: PR Tests (ai-cs-demo)
# ======================================================================================
# Adapted from W11 ERP Admin .github/workflows/pr-tests.yml.
#
# ai-cs-demo is a single-package Next.js 16 monorepo, so we collapse W11's
# backend / frontend dual-job layout into a single cs-tests job gated by a
# paths-filter over the ai-cs-demo subtree only.
#
# Step order:
#   checkout -> pnpm 9 -> node 20 (cache pnpm) -> pnpm install --frozen-lockfile
#   -> pnpm lint -> tsc --noEmit (Next.js doesn't type-check on dev/test)
#   -> pnpm test:coverage
#   -> upload coverage/ artifact (14d retention; S5 will start producing it)
#
# Conventions (project guideline):
#   - All third-party actions pinned by full commit SHA (not floating tags).
#   - paths-filter keeps cs-tests from running on unrelated W11 / unrelated
#     W9-10 sub-projects living in sibling directories of the agents monorepo.
#   - Cache key uses ai-cs-demo/pnpm-lock.yaml so it doesn't collide with W11.
# ======================================================================================

name: PR Tests

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      ai-cs-demo: ${{ steps.filter.outputs.ai-cs-demo }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Filter paths
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            ai-cs-demo:
              - 'W9-10-customer-service/ai-cs-demo/**'
              - '.github/workflows/pr-tests.yml'

  ai-cs-demo-tests:
    name: ai-cs-demo unit + coverage
    needs: changes
    if: ${{ (github.event_name == 'workflow_dispatch' || needs.changes.outputs.ai-cs-demo == 'true') && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: W9-10-customer-service/ai-cs-demo

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: W9-10-customer-service/ai-cs-demo/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check (Next.js dev doesn't tsc on test; explicit gate)
        run: pnpm exec tsc --noEmit

      - name: Run unit tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: ai-cs-demo-coverage
          path: W9-10-customer-service/ai-cs-demo/coverage/
          if-no-files-found: warn
          retention-days: 14