# ======================================================================================
# Workflow: SSD Spec Checks (root test:spec + spec:audit)
# ======================================================================================
# 2026-07-31 §A 落地:跑根 `tests/_specs/` 的 vitest spec + 漂移检测。
# 后端 jest e2e 由 pr-e2e.yml 单独覆盖(已存在,跑真实 MySQL/Chroma)。
#
# 跑法:
#   pnpm install --frozen-lockfile
#   pnpm test:spec      # vitest 跑 tests/_specs/**/*.spec.ts(根 spec 落点)
#   pnpm spec:audit     # spec ↔ code 漂移检测
#
# 路径过滤:仅在 SSD workflow 相关文件变动时触发,避免无关 PR 跑空 spec。
# ======================================================================================

name: SSD Spec Checks

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - 'tests/_specs/**'
      - 'docs/ssd-status.md'
      - 'CLAUDE.md'
      - 'scripts/spec-*.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vitest.config.ts'
      - 'tests/_specs/README.md'
      - '.github/workflows/ssd-spec-checks.yml'
  workflow_dispatch:

concurrency:
  group: ssd-spec-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  spec-and-audit:
    name: Vitest specs + drift audit
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run spec tests (vitest)
        run: pnpm test:spec

      - name: Run spec drift audit
        run: pnpm spec:audit

      - name: Upload spec report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: spec-audit-report
          path: |
            coverage/
            *.md
          if-no-files-found: warn
          retention-days: 14
