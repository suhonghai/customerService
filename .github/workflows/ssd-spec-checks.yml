# ======================================================================================
# Workflow: SSD Spec Checks (root test:spec + spec:audit)
# ======================================================================================
# 2026-07-31 §A 落地:跑根 `tests/_specs/` 的 vitest spec + 漂移检测。
# 后端 jest e2e 由 pr-e2e.yml 单独覆盖(已存在,跑真实 MySQL/Chroma)。
#
# 跑法:
#   pnpm install --frozen-lockfile
#   pnpm test:spec      # vitest 跑 tests/_specs/**/*.spec.ts(根 spec 落点)
#   pnpm spec:audit     # spec ↔ code 漂移检测
#
# 路径过滤:仅在 SSD workflow 相关文件变动时触发,避免无关 PR 跑空 spec。
# ======================================================================================

name: SSD Spec Checks

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - 'tests/_specs/**'
      - 'docs/ssd-status.md'
      - 'CLAUDE.md'
      - 'scripts/spec-*.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vitest.config.ts'
      - 'tests/_specs/README.md'
      - '.github/workflows/ssd-spec-checks.yml'
  workflow_dispatch:

concurrency:
  group: ssd-spec-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # sticky comment 需要写权限;原为 read,导致「Post spec status as PR comment」
  # 报 "Resource not accessible by integration"。
  # 这个 workflow 此前因两个失效的 action SHA pin 从未真正跑起来,所以该问题一直没暴露。
  pull-requests: write

jobs:
  spec-and-audit:
    name: Vitest specs + drift audit
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run spec tests (vitest)
        run: pnpm test:spec

      - name: Run spec drift audit
        run: pnpm spec:audit

      - name: Run spec status report
        id: spec-status
        run: pnpm spec:status

      - name: Check Spec Quality Review (PR body)
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const body = context.payload.pull_request?.body ?? '';
            // 找 Spec Quality Review 段
            const section = body.match(/## Spec Quality Review[\s\S]*?(?=\n## |\s*$)/);
            if (!section) {
              core.setFailed('❌ PR body 缺 "Spec Quality Review" 段(参考 .github/pull_request_template.md)');
              return;
            }
            // 检查 3 条 reviewer 规则 + N/A,至少有 1 个 `- [x]`
            const checked = (section[0].match(/^- \[x\] /gm) ?? []).length;
            if (checked === 0) {
              core.setFailed(
                '❌ Spec Quality Review 没勾任何一项。\n' +
                'reviewer 必须勾:\n' +
                '  - 外部可观察 + Given-When-Then 完整 + Out of scope 显式(若本 PR 改 spec)\n' +
                '  - 或 N/A(若本 PR 不改 spec)',
              );
              return;
            }
            core.info(`✓ Spec Quality Review 已勾 ${checked} 项`);

      - name: Post spec status as PR comment
        if: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}
        # 这一步是**通知**,不是守门:真正的门是上面的 test:spec / spec:audit / PR body 校验。
        # fork 发来的 PR 拿不到 pull-requests:write,评论必然失败 —— 不该因此把整条检查判红。
        # ⚠️ 仅限通知类步骤可以这样;守门步骤永远不要加 continue-on-error(那就是本次修的「守门空转」病根)。
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@52423e01640425a022ef5fd42c6fb5f633a02728 # v2.9.1
        with:
          header: ssd-spec-status
          message: |
            ## 📋 Spec Status Snapshot

            ```
            ${{ steps.spec-status.outputs.stdout }}
            ```

            ---
            详细 spec 审计:点 [Checks] → "Vitest specs + drift audit" → [spec-audit-report] artifact

      - name: Upload spec report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: spec-audit-report
          path: |
            coverage/
            *.md
          if-no-files-found: warn
          retention-days: 14
