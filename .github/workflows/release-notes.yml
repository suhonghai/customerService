# ======================================================================================
# Workflow: Generate Release Notes (W11 ERP Admin)
# ======================================================================================
# Adapted from skillhub .github/workflows/release-notes.yml, simplified for the
# W11 monorepo:
#   - Pure conventional-commits grouping (chore / feat / fix / docs / refactor / test).
#   - LLM rendering uses GitHub Models API (default: openai/gpt-4o-mini) and
#     silently falls back to deterministic grouping on any failure — never
#     blocks a release.
#   - On push of `v*` tag → publish a GitHub Release using softprops/action-gh-release.
#   - `workflow_dispatch` allows manual dry runs against arbitrary tag ranges.
#
# Permissions:
#   - `contents: write` — to create the GitHub Release.
#   - `models: read`     — required for GitHub Models API access.
# ======================================================================================

name: Generate Release Notes

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      from:
        description: "From tag/commit (default: previous tag, or repo root commit)"
        required: false
      to:
        description: "To tag/commit (default: current push ref)"
        required: false

concurrency:
  group: release-notes-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  models: read

jobs:
  release-notes:
    name: Generate & Publish Release Notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Deno
        uses: denoland/setup-deno@11b63cf76cfcafb4e43f97b6cad24d8e8438f62d # v1.5.2
        with:
          deno-version: v1.x

      - name: Determine tag range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TO="${{ github.ref_name }}"
          else
            TO_INPUT="${{ inputs.to }}"
            if [ -n "$TO_INPUT" ]; then
              TO="$TO_INPUT"
            else
              TO="${{ github.sha }}"
            fi
          fi
          FROM_INPUT="${{ inputs.from }}"
          if [ -n "$FROM_INPUT" ]; then
            FROM="$FROM_INPUT"
          else
            FROM=$(git tag --sort=-version:refname | grep -v "^${TO}$" | head -1 || true)
            if [ -z "$FROM" ]; then
              FROM=$(git rev-list --max-parents=0 HEAD | head -1)
            fi
          fi
          echo "from=$FROM" >> "$GITHUB_OUTPUT"
          echo "to=$TO" >> "$GITHUB_OUTPUT"

      - name: Generate release notes (LLM with fallback)
        env:
          # Prefer an explicit secret; fall back to GITHUB_TOKEN so the default
          # GitHub Models endpoint just works without extra repo config.
          RELEASE_NOTES_LLM_API_KEY: ${{ secrets.RELEASE_NOTES_LLM_API_KEY || secrets.GITHUB_TOKEN }}
          RELEASE_NOTES_LLM_MODEL: ${{ vars.RELEASE_NOTES_LLM_MODEL || 'openai/gpt-4o-mini' }}
          RELEASE_NOTES_LLM_BASE_URL: ${{ vars.RELEASE_NOTES_LLM_BASE_URL || 'https://models.github.ai/inference' }}
        run: |
          set -euo pipefail
          NOTES=$(deno run --allow-net --allow-read --allow-env --allow-run \
            .github/scripts/release-notes.ts \
            --from "${{ steps.range.outputs.from }}" \
            --to "${{ steps.range.outputs.to }}")
          echo "$NOTES" > release-notes.md
          # Strip the marker lines from the published release body.
          sed -i '/^--- BEGIN RELEASE NOTES ---$/d; /^--- END RELEASE NOTES ---$/d' release-notes.md
          echo "Generated release notes ($(wc -l < release-notes.md) lines)"

      - name: Publish to GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@3198ee18f814cdf787321b4a32a26ddbf37acc52 # v2.0.3
        with:
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}
