# ======================================================================================
# Workflow: PR Tests (W11 ERP Admin)
# ======================================================================================
# Adapted from skillhub .github/workflows/pr-tests.yml.
#
# Two parallel jobs gated by paths-filter:
#   - backend-tests: NestJS + Prisma unit tests (pnpm test) — backend e2e moved to
#     pr-e2e.yml since it needs MySQL + Chroma service stack.
#   - frontend-tests: React + Vite + Vitest unit tests + coverage.
#
# Conventions (project guideline):
#   - All third-party actions pinned by full commit SHA (not floating tags).
#   - paths-filter keeps backend / frontend jobs from running on unrelated changes.
#   - Cache key uses per-package pnpm-lock.yaml so backend / frontend caches don't
#     collide.
# ======================================================================================

name: PR Tests

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ai-cs-demo: ${{ steps.filter.outputs.ai-cs-demo }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Filter paths
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            backend:
              - 'erp-admin-backend/**'
              - 'Makefile'
              - '.github/workflows/pr-tests.yml'
            frontend:
              - 'erp-admin-frontend/**'
              - 'Makefile'
              - '.github/workflows/pr-tests.yml'
            ai-cs-demo:
              - 'ai-cs-demo/**'
              - 'Makefile'
              - '.github/workflows/pr-tests.yml'

  backend-tests:
    name: Backend Unit Tests
    needs: changes
    if: ${{ (github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true') && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: erp-admin-backend/pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: erp-admin-backend
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: erp-admin-backend
        run: pnpm exec prisma generate

      # cs-prisma-drift-guard:验 schema 语法 + 类型(无 DB 依赖,跑 ~1s)
      # 拦截 prisma 字段名 typo / 类型不匹配,让 schema 错在 PR 阶段就暴露
      # 不替代 prisma migrate status(migrate status 需要 DB,本 workflow 不起 MySQL)
      # 注:走 pnpm prisma:validate 而非 pnpm exec prisma validate,因为 script 自带 dummy DATABASE_URL
      # (validate 不连 DB,只验 schema 语法,只需要变量存在)
      - name: Validate Prisma schema
        working-directory: erp-admin-backend
        run: pnpm prisma:validate

      - name: Run backend unit tests
        working-directory: erp-admin-backend
        run: pnpm test

      - name: Upload backend coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: backend-coverage
          path: erp-admin-backend/coverage/
          if-no-files-found: warn
          retention-days: 14

  frontend-tests:
    name: Frontend Unit Tests + Coverage
    needs: changes
    if: ${{ (github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true') && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: erp-admin-frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: erp-admin-frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: erp-admin-frontend
        run: pnpm build

      - name: Run frontend unit tests with coverage
        working-directory: erp-admin-frontend
        run: pnpm test:coverage

      - name: Upload frontend coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: frontend-coverage
          path: erp-admin-frontend/coverage/
          if-no-files-found: warn
          retention-days: 14

  ai-cs-demo-tests:
    name: AI CS Demo Unit Tests
    needs: changes
    if: ${{ (github.event_name == 'workflow_dispatch' || needs.changes.outputs.ai-cs-demo == 'true') && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ai-cs-demo/pnpm-lock.yaml

      - name: Install ai-cs-demo dependencies
        working-directory: ai-cs-demo
        run: pnpm install --frozen-lockfile

      - name: Build ai-cs-demo
        working-directory: ai-cs-demo
        run: pnpm build

      - name: Run ai-cs-demo unit tests
        working-directory: ai-cs-demo
        run: pnpm test

      - name: Upload ai-cs-demo coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: ai-cs-demo-coverage
          path: ai-cs-demo/coverage/
          if-no-files-found: warn
          retention-days: 14