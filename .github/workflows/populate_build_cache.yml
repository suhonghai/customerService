# ======================================================================================
# Workflow: Populate Build Cache (W11 ERP Admin)
# ======================================================================================
# Adapted from skillhub .github/workflows/populate_build_cache.yml (which is itself
# adapted from warpdotdev/warp). W11 version drops the Maven warm job (W11 is a
# pure pnpm monorepo — no Maven) and keeps two parallel pnpm warm jobs:
#   - warm-backend:   pre-fetch `erp-admin-backend/node_modules`
#   - warm-frontend:  pre-fetch `erp-admin-frontend/node_modules`
#
# Purpose:
#   - Pre-warm the `~/.local/share/pnpm/store/v3` (the GitHub-managed pnpm cache
#     key is `pnpm-lock.yaml` hash) so PR CI hits a hot cache and skips the
#     ~60-180s cold install step.
#   - Triggered on `push main` when lockfile or Makefile changes, plus weekly
#     cron at Tuesday 06:00 CST (= 22:00 UTC Monday) to keep the cache fresh
#     even during quiet periods.
#
# Conventions (project guideline):
#   - All third-party actions pinned by full 40-character commit SHA.
#   - `concurrency.cancel-in-progress: true` so a pushed commit interrupts the
#     scheduled run (and vice versa) — keeps Actions minutes bounded.
#   - `permissions: contents: read` (only reads repo; cannot push secrets).
#   - `--ignore-scripts` keeps cache lean (no preinstall/postinstall side
#     effects; Prisma generate is idempotent and runs again on real CI).
#   - No docker warm job: W11 uses stock Node 20 + pnpm 9 actions on GH runners.
# ======================================================================================

name: Populate Build Cache

on:
  push:
    branches:
      - main
    paths:
      - 'erp-admin-backend/pnpm-lock.yaml'
      - 'erp-admin-frontend/pnpm-lock.yaml'
      - 'Makefile'
  schedule:
    # Weekly Monday 22:00 UTC = Tuesday 06:00 CST. Keeps cache warm before workday.
    - cron: '0 22 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One in-flight cache warm per ref; a second event cancels the first.
  group: populate-build-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warm-backend:
    name: Warm backend pnpm cache
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: erp-admin-backend/pnpm-lock.yaml

      - name: Install backend dependencies (frozen, no scripts)
        working-directory: erp-admin-backend
        run: pnpm install --frozen-lockfile --ignore-scripts

  warm-frontend:
    name: Warm frontend pnpm cache
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: erp-admin-frontend/pnpm-lock.yaml

      - name: Install frontend dependencies (frozen, no scripts)
        working-directory: erp-admin-frontend
        run: pnpm install --frozen-lockfile --ignore-scripts
