# =============================================================================
# W11 ERP Admin — UAT overlay
# 5 服务全 docker(预生产)
# 子项目 secrets 走 env_file 加载子项目 .env.uat
# =============================================================================

services:
  mysql:
    ports:
      - "127.0.0.1:${MYSQL_PORT}:3306"

  chroma:
    ports:
      - "127.0.0.1:${CHROMA_PORT}:8000"

  erp-admin-backend:
    build:
      context: ./erp-admin-backend
      dockerfile: Dockerfile
      args:
        NODE_ENV: uat
        BUILD_ENV: uat
    image: w11-backend:uat
    container_name: ${COMPOSE_PROJECT_NAME}-backend
    env_file:
      - ./erp-admin-backend/.env.uat
    environment:
      NODE_ENV: uat
      PORT: 3001
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      CHROMA_URL: http://chroma:8000
    ports:
      - "127.0.0.1:${BACKEND_PORT}:3001"
    depends_on:
      mysql:
        condition: service_healthy
      chroma:
        condition: service_healthy
    networks:
      - w11-net
    volumes:
      - backend_uploads:/data/uploads
      - backend_logs:/data/logs/erp-admin
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/api/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  erp-admin-frontend:
    build:
      context: ./erp-admin-frontend
      dockerfile: Dockerfile
      args:
        BUILD_ENV: uat
    image: w11-frontend:uat
    container_name: ${COMPOSE_PROJECT_NAME}-frontend
    env_file:
      - ./erp-admin-frontend/.env.uat
    ports:
      - "127.0.0.1:${FRONTEND_PORT}:80"
    depends_on:
      - erp-admin-backend
    networks:
      - w11-net
    restart: unless-stopped

  ai-cs-demo:
    build:
      context: ./ai-cs-demo
      dockerfile: Dockerfile
      args:
        APP_ENV: uat
    image: w11-ai-cs-demo:uat
    container_name: ${COMPOSE_PROJECT_NAME}-ai-cs-demo
    env_file:
      - ./ai-cs-demo/.env.uat
    environment:
      APP_ENV: uat
      NODE_ENV: uat
      PORT: 9529
      ERP_ADMIN_URL: http://erp-admin-backend:3001
      CHROMA_URL: http://chroma:8000
    ports:
      - "127.0.0.1:${AI_CS_PORT}:9529"
    depends_on:
      - erp-admin-backend
      - chroma
    networks:
      - w11-net
    restart: unless-stopped

volumes:
  backend_uploads:
    name: ${COMPOSE_PROJECT_NAME}-backend-uploads
  backend_logs:
    name: ${COMPOSE_PROJECT_NAME}-backend-logs
