# =============================================================================
# W11 ERP Admin — nginx 反代配置(production,Ubuntu 24.04 部署)
# 端到端测试:e2e-test-1
#
# 三个 server block:
#   - app.suhhai.cn  → erp-admin-frontend 容器(管理后台 SPA)
#   - chat.suhhai.cn → ai-cs-demo 容器(Next.js 终端客服)
#   - api.suhhai.cn  → erp-admin-backend 容器(REST API + WebSocket)
#
# 证书:Let's Encrypt,通过 certbot 容器申请,挂在 /etc/nginx/ssl
# HTTP-01 challenge:.well-known/acme-challenge 走 /var/www/certbot
# =============================================================================

# 共享设置:SSL 全局参数
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# 共享:WebSocket upgrade 头(ai-cs-demo 用)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------------------------------------------------------------------------
# 80 端口统一入口:除 ACME challenge 外全部 301 到 https
# (certbot 容器申请 / 续期证书时,通过 /.well-known/acme-challenge/ 命中这个)
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name app.suhhai.cn chat.suhhai.cn api.suhhai.cn;

    # certbot ACME challenge webroot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ACME 验证 + 健康检查之外,统一 301 到 https
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# app.suhhai.cn — 运营后台前端(SPA)
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.suhhai.cn;

    ssl_certificate     /etc/nginx/ssl/live/app.suhhai.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/app.suhhai.cn/privkey.pem;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml font/ttf font/otf;
    gzip_min_length 1024;
    gzip_vary on;

    # /api 反代到 backend 容器
    location /api/ {
        proxy_pass http://erp-admin-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        proxy_buffering off;
    }

    # /uploads 反代到 backend(文件上传后访问路径)
    location /uploads/ {
        proxy_pass http://erp-admin-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 其它路径反代到 frontend 容器(它自己有 nginx 处理 SPA fallback)
    location / {
        proxy_pass http://erp-admin-frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------------------------------------------------------------------------
# chat.suhhai.cn — AI 客服(Next.js)
# Next.js 启动时 BIND hostname 检查可能挡,这里透传 Host
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name chat.suhhai.cn;

    ssl_certificate     /etc/nginx/ssl/live/app.suhhai.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/app.suhhai.cn/privkey.pem;

    # 所有路径(含 /api → backend, /ws → backend WS)反代到 ai-cs-demo 容器
    location / {
        proxy_pass http://ai-cs-demo:9529;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        # Next.js 长连接 / WebSocket 时间放宽
        proxy_connect_timeout 10s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_buffering off;
    }
}

# ---------------------------------------------------------------------------
# api.suhhai.cn — 后端 REST API(直接给前端调用,不直接面向用户)
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.suhhai.cn;

    ssl_certificate     /etc/nginx/ssl/live/app.suhhai.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/app.suhhai.cn/privkey.pem;

    location / {
        proxy_pass http://erp-admin-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        proxy_buffering off;
    }
}