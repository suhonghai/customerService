worker_processes  auto;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;

events {
    worker_connections  4096;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log off;
    error_log  logs/error.log warn;

    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;

    keepalive_timeout  65;
    types_hash_max_size 2048;

    gzip  on;
    gzip_types text/plain application/xml application/json application/javascript text/css;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_vary on;

    server_tokens off;
    client_max_body_size 20M;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HTTP 强制跳转 HTTPS
    server {
        listen 80;
        server_name suhhai.cn;
        return 301 https://$host$request_uri;
    }

    # HTTPS 服务
    server {
        listen 443 ssl;
        server_name suhhai.cn;

        ssl_certificate C:\\Users\\Administrator\\Desktop\\nginx-1.28.0\\suhhai.cn_bundle.crt;
        ssl_certificate_key C:\\Users\\Administrator\\Desktop\\nginx-1.28.0\\suhhai.cn.key;

        root C:\\Users\\Administrator\\Desktop\\nginx-1.28.0\\html\\my-blog;

        location / {
            try_files $uri $uri/ =404;
        }

        location /babyTao/ {
            proxy_pass http://127.0.0.1:8000/;
            include proxy_params;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /test-babyTao/ {
            proxy_pass http://127.0.0.1:8001/;
            include proxy_params;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /babyTaoChat/ {
            proxy_pass http://127.0.0.1:5001/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off; # 禁用缓冲以避免某些流式请求出错
        }

        location /qwen_chat/ {
            alias C:/Users/Administrator/Desktop/nginx-1.28.0/html/oss/qwen_chat_-frontend/dist/;
            index index.html;
            try_files $uri $uri/ /qwen_chat/index.html;
        }

        # === W11 ERP 运营后台(2026-06-25 新增)===
        # 前端 SPA 静态托管 + /erp/api/* 反代到后端 3001
        location /erp/ {
            alias C:/Users/Administrator/Desktop/nginx-1.28.0/html/oss/erp-admin-frontend/dist/;
            index index.html;
            try_files $uri $uri/ /erp/index.html;

            # 后端 API 反代
            location /erp/api/ {
                proxy_pass http://127.0.0.1:3001/api/;
                include proxy_params;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            # 上传文件直接 serve
            location /erp/uploads/ {
                alias C:/Users/Administrator/Desktop/erp-admin/erp-admin-backend/uploads/;
                expires 30d;
            }
        }

        # === W11 AI 智能客服(ai-cs-demo,Next.js,2026-06-25 新增)===
        # /cs/* 整体反代到 9529(Next.js 自带路由)
        location /cs/ {
            proxy_pass http://127.0.0.1:9529/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            proxy_buffering off;   # 流式输出不缓冲
            proxy_read_timeout 600s;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root html;
        }

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff;
        # 注释这一行，使小程序可以嵌套
        # add_header X-Frame-Options DENY;
        add_header Content-Security-Policy "frame-ancestors 'self' https://suhhai.cn *.qq.com;";
        add_header X-XSS-Protection "1; mode=block";
    }
}
