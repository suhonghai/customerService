# =============================================================================
# W11 ERP Admin frontend nginx.conf
# - 静态 SPA 服务 /usr/share/nginx/html
# - try_files 走 SPA fallback
# - /api 与 /uploads 反代到后端容器(走 docker 网络 w11-backend)
# =============================================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip 静态资源
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml font/ttf font/otf;
    gzip_min_length 1024;
    gzip_vary on;

    # SPA fallback:所有非 /api /uploads 的 GET 都回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 长 cache 静态资源(assets 目录,Vite build 后带 hash)
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # /api 反代到 backend(容器内走 compose DNS,服务名 erp-admin-backend,端口 3001)
    location /api/ {
        proxy_pass http://erp-admin-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        proxy_buffering off;
    }

    # /uploads 反代到 backend(文件上传后的访问路径)
    location /uploads/ {
        proxy_pass http://erp-admin-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查(给 docker/k8s 用)
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}